[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegval"
version = "0.1.0"
description = "Modality-agnostic EEG signal-quality metrics and fault-injection validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
eeglab = ["mne>=1.6"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["eegval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"